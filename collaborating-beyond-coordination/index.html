# Collaboration<br>Beyond Coordination

---

class: big

How do you make progress
--
 when **everything is changing**
--
 and 99.9% of it is out of your control?

---

class: center, middle

.too-tall[
    ![the Tower of Babel](babel.png)
]

???

We'd like to think that we're building on solid foundations.
Often, it feels like we are.

In reality, though, everything in the computing world is changing
all the time, (as I'm sure you're aware)

Yet a lot of things seem pretty much constant.

- I can visit a website that hasn't been updated since 1995, and it still displays
  pretty much the way the author intended. Even the JavaScript still works!
- I can use my modern PC to play games that were written in the '90s and originally distributed on floppy disks.
- I can compile a Go program written in 2012 with a compiler released in 2020, and run it on a Linux kernel from 2025.

...and I can do all this without help from any of the maintainers of the systems involved!

How is this possible?

---

class: center, middle

Software Engineering ✅

???

What actually allows these systems to keep working is, of course, software engineering.

---

class: middle

> As it turns out, “don’t break the Web” is **the number one design principle** for HTML, CSS, JavaScript, and any
> other standard that’s widely used on the Web.

[Mathias Bynens, Google](https://developer.chrome.com/blog/smooshgate/#why_don%E2%80%99t_we_just_fix_mootools)

???

This is really, really important.

---

class: middle

> Breaking user programs simply isn't acceptable. \[...\] We know that people use old binaries for years and years, and that making a new \[Linux\] release doesn't mean that you can just throw that out. **You can trust us.**

[Linus Torvalds](https://yarchive.net/comp/linux/gcc_vs_kernel_stability.html)

---

class: center, middle

These systems guarantee **backward compatibility**

???

More specifically, the pieces that make up these systems are built with backward compatibility in
mind.

## 1. What is backward compatibility?

---

class: center, middle

Backward compatibility == &ldquo;Don't break other people's stuff&rdquo;

---

## Backward compatibility is...

- A property of a **change** to a published interface
- A **guarantee** we make to consumers of our interfaces

---

class: center, middle

## The Backward Compatibility Guarantee

&ldquo;If your code/data works with the old version of our interface, then it will also work the new version.&rdquo;

---

class: center, middle

A change that is not backward compatible is called a **breaking change**.

---

class: center, middle

.box[UI] &lrarr; .box[Service] &lrarr; .box[Data]

NOTE: &lrarr; = interface

???

By "interface" I just mean "how something look from the outside" or "how you
interact with it from the outside" 

---

class: center, middle

## 2. Why do we care?

---

class: center, middle, big

Almost everything that exists today<br>&nbsp;
--
also existed **yesterday**

???

Almost everything that exists today also existed yesterday, and all that existing stuff is hugely valuable.
You want that code you wrote last week to keep working next week. You want the files you save to still be readable in 10 years.

---

class: center, middle, big

We can't **rebuild the world** every time<br>we want to change one thing

???

When ECMA decides to add a new feature to JavaScript, we could try to stop the world and rewrite all existing websites.
But that would be really expensive, maybe impossible. And throwing away all that value would be expensive too.

---

class: center, middle, big

Backward compatibility<br>makes progress **affordable**

---

class: center, middle, big

Which brings me to **us**...

---

class: center, middle

## 2.5. When does backward compatibility matter?

---

class: center, middle

When two systems interact and they are **versioned or deployed separately**,
changes to either must be backward compatible with the other.

---

## Examples:

- Frontend and backend
- Service APIs
- Library APIs

---

class: center, middle

**Within a single service or package**, backward compatibility isn't as important.

---

class: center, middle

## 3. How to make backward-compatible changes

---

class: center, middle

## Step 1: Define your published interface

---

## Step 1: Define your published interface

- API documentation

--

- GraphQL schema

--

- Test suite

---

## Example: A GraphQL API

```graphql
type Query {
    grade(
        assessmentItem: String! # JSON
        userInput: String! # JSON
    ) Grade!
}

type Grade {
    score: Score!
    feedback: String
}

enum Score {
    CREDIT
    NO_CREDIT
}
```

---

## Scenario: Locale-specific grading

Different locales use different number formats! `1.0` vs. `1,0`

--

```diff
  type Query {
      grade(
          assessmentItem: String! # JSON
          userInput: String! # JSON
+         locale: String!
      ) Grade!
  }
```

???

What do you think? Is this change backward-compatible or not?

--

**Breaking change!** `locale` is required

---

## Solution: Make `locale` optional

```diff
  type Query {
      grade(
          assessmentItem: String! # JSON
          userInput: String! # JSON
-         locale: String!
+         locale: String
      ) Grade!
  }
```

---

## Problem: clients should _always_ provide a locale!

- Solution: update all clients to pass `locale`

- and _then_ update the GraphQL schema to make `locale` required.

--

- Making locale required is technically a breaking change

- But in practice we only need to worry about breaking clients that _actually exist_.

---

## Example 2: Changing an Enum

```diff
  type Query {
      grade(
          assessmentItem: String! # JSON
          userInput: String! # JSON
      ) Grade!
  }
  
  type Grade {
      score: Score!
      feedback: String
  }
  
  enum Score {
      CREDIT
      NO_CREDIT
+     # The submitted answer was incomplete. The learner can try again.
+     INVALID
  }
```

???

What do you think about this change? Is it backward compatible or not?

---

## Imagine the frontend code

```ts
function displayScore(score: GqlScore): string {
    switch (score) {
        case "CREDIT":
            return "Correct!";
        case "NO_CREDIT":
            return "Not quite, try again.";
        default:
            throw Error("Unrecognized GqlScore: " + score);
    }
}
```

---

class: center, middle

What if we just didn't throw? 🤔

## Even worse: undefined behavior!

```ts

    if (score === "NO_CREDIT") {
        return "Not quite, try again.";
    }
    return "Correct!";
}

function handleQuestionCompleted(score: GqlScore): string {
    if (score === "CREDIT") {
        correctAnswers++;
    }
    return displayScore(score);
}
```

---

class: center, middle, big

Since the backend change can't be made backward-compatible...

---

class: center, middle, big

...we have to make the frontend<br>**forward-compatible**!

---

## Forward-compatible enum handling

Trick: convert to a frontend-internal enum _in a single place_.

```ts
// handwritten type
type Score = "credit" | "no-credit";
function parseScore(raw: GqlScore): Score {
    switch (raw) {
        case "CREDIT":
            return "credit";
        default:
            return "no-credit";
    }
}
```

--

Now, all unrecognized `GqlScore` values will be treated like `NO_CREDIT`.

---

## Forward-compatible enum handling 2

We can use exhaustive switch statements in the rest of the code to make sure
we handle all the cases.

```ts
function displayScore(score: Score): string {
    switch (score) {
        case "credit":
            return "Correct!";
        case "no-credit":
            return "Not quite, try again.";
        default:
            // There will be a type error here if we didn't handle all cases
            throw new UnreachableCaseError(score);
    }
}
```

---

class: center, middle

At this point, we can safely deploy the backend change to add `INVALID` to the
GraphQL API.

---

## Forward-compatible enum handling 3

Then we can update the frontend to handle the new case:

```ts
type Score = "credit" | "no-credit" | "invalid";
function parseScore(raw: GqlScore): Score {
    switch (raw) {
        case "CREDIT":
            return "credit";
        case "INVALID":
            return "invalid";
        default:
            return "no-credit";
    }
}
```

---

## Backward-compatible enum handling 4

Now the exhaustiveness check forces us to update the business logic at the
same time.

```ts
function displayScore(score: Score): string {
    switch (score) {
        case "credit":
            return "Correct!";
        case "no-credit":
            return "Not quite, try again.";
        case "invalid":
            return "Hmm, looks like your answer is incomplete."
        default:
            // There will be a type error here if we didn't handle all cases
            throw new UnreachableCaseError(score);
    }
}
```

---

class: center, middle

Enums considered harmful?

???

I hope that if nothing else, this convinces you that enums need to be handled
with care.

---

## Summary: backward-compatible changes to GraphQL APIs

- Adding a new, optional input value
- Adding a response field

---

## Backward-compatible changes to Go `struct` types

- Adding a new field (assuming the zero value is a good default)
- Adding a new method (i.e. function with a receiver argument)

---

## Backward-compatible changes to Go `interface` types

Depends on who implements the interface and who calls it.

- Adding a method to an interface (assuming no one but you implements the interface)
- Removing a method from an interface (assuming no one but you calls the interface)

Treat tests as an **append-only log of guarantees** you make to your callers.

---

class: center, middle

Prefer testing at **published interfaces** that need to be stable.

## API Design Tip

**Don't over-promise.** Start simple and add more functionality if needed.

---

## Challenges / Open Questions

- How can we speed up the process of splitting a big breaking change into small, backward-compatible changes?
- How can we reduce the risk of abandoning a sequence of changes halfway through, not finishing or rolling back?

---

## Parting thoughts

> I'm not saying that we can always support everything that goes on in
user space forever, but dammit, we can try damn hard.

[Linus Torvalds](https://yarchive.net/comp/linux/gcc_vs_kernel_stability.html)

## Parting thoughts

But Linux _does_ break user programs...

> Complain more. \[Programs\] break not because we don't care, but because we
